<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidyco Operations Portal</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- CSS load order: global shell → shared components → feature modules -->
<link rel="stylesheet" href="core/css/main.css">
<link rel="stylesheet" href="core/css/components.css">
<link rel="stylesheet" href="portals/bugs/css/bugs.css">
<link rel="stylesheet" href="portals/product-development/npi/css/dashboard.css">
<link rel="stylesheet" href="portals/hub/css/hub.css">
<link rel="stylesheet" href="portals/capacity/css/capacity.css">
<link rel="stylesheet" href="portals/capacity/css/me-capacity.css">
<link rel="stylesheet" href="portals/capacity/css/prod-capacity.css">
<link rel="stylesheet" href="portals/production/css/production.css">
<link rel="stylesheet" href="portals/product-development/product-management/css/products.css">
<link rel="stylesheet" href="portals/productmgmt/css/productmgmt.css">
<link rel="stylesheet" href="portals/product-development/npi/css/pfmea.css">
<link rel="stylesheet" href="portals/product-development/npi/css/gantt.css">
<link rel="stylesheet" href="portals/product-development/npi/css/apqp.css">
<link rel="stylesheet" href="portals/product-development/npi/css/rpn-chart.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- ═══════════════════════════════════
     LOGIN SCREEN
     ═══════════════════════════════════ -->
<div id="loginScreen" class="login-shell">
  <div class="login-box">
    <div class="login-logo">
      <img src="Tidyco logo-blue.png" alt="Tidyco" class="login-logo-img">
      <div class="login-logo-sub">Operations Portal</div>
    </div>
    <div class="login-title">Sign in</div>
    <div class="login-err" id="loginErr"></div>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@company.com" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign in</button>
  </div>
</div>

<!-- ═══════════════════════════════════
     APP SHELL
     ═══════════════════════════════════ -->
<div class="shell" id="appShell" style="display:none">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="brand" onclick="navigate('hub')" style="cursor:pointer">
        <div class="brand-hex"></div>
        <span class="brand-name">TIDYCO</span>
        <span class="brand-sep">|</span>
        <span class="brand-sub">Operations Portal</span>
      </div>
      <button class="back-btn" id="returnHubBtn" style="display:none" onclick="navigateBack()">← Return to Portal</button>
    </div>
    <div class="topbar-center">
      <button class="bug-report-btn" onclick="navigate('bugreports')">🪳 Report a Bug</button>
    </div>
    <div class="topbar-actions">
      <span class="sync-badge" id="syncBadge">● saved</span>
      <button class="tbtn tbtn-ghost" onclick="exportJSON()" style="display:none">⬇ Export</button>
      <button class="tbtn tbtn-ghost" onclick="document.getElementById('importInput').click()" style="display:none">⬆ Import</button>
      <input type="file" id="importInput" accept=".json" style="display:none" onchange="importJSON(event)">
      <button class="tbtn tbtn-ghost" onclick="doLogout()" title="Sign out" style="margin-left:4px">⏻</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main" id="mainContent"></div>


</div><!-- end appShell -->

<!-- ═══════════════════════════════════
     MODALS
     ═══════════════════════════════════ -->

<!-- New Project -->
<div class="modal-bg" id="modalNewProj" style="display:none">
  <div class="modal modal-sm">
    <div class="modal-title">New Project</div>
    <div class="field"><label>Project Name *</label><input id="np_name" placeholder="e.g. Class 158 Traction Motor Overhaul"></div>
    <div class="field-row">
      <div class="field"><label>Customer</label><input id="np_customer"></div>
      <div class="field"><label>Unit / Product</label><input id="np_unit"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Product Family</label>
        <select id="np_family"></select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>ME Lead</label><input id="np_lead"></div>
      <div class="field"><label>Project Manager</label><input id="np_pm"></div>
    </div>
    <div class="field"><label>Start Date</label><input type="date" id="np_date"></div>
    <div class="field-row">
      <div class="field"><label>Q Number</label><input id="np_qNumber"></div>
      <div class="field"><label>Part Number</label><input id="np_partNumber"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalNewProj')">Cancel</button>
      <button class="btn btn-primary" onclick="npi.dashboard.createProg()">Create</button>
    </div>
  </div>
</div>

<!-- Edit Project -->
<div class="modal-bg" id="modalEditProj" style="display:none">
  <div class="modal modal-sm">
    <div class="modal-title">Edit Project</div>
    <div class="field"><label>Project Name *</label><input id="ep_name" placeholder="e.g. Class 158 Traction Motor Overhaul"></div>
    <div class="field-row">
      <div class="field"><label>Customer</label><input id="ep_customer"></div>
      <div class="field"><label>Unit / Product</label><input id="ep_unit"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Product Family</label>
        <select id="ep_family"></select>
      </div>
      <div class="field"><label>Project Status</label>
        <select id="ep_status">
          <option value="Active">Active</option>
          <option value="Tender">Tender</option>
          <option value="Archive">Archive</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>ME Lead</label><input id="ep_lead"></div>
      <div class="field"><label>Project Manager</label><input id="ep_pm"></div>
    </div>
    <div class="field"><label>Start Date</label><input type="date" id="ep_date"></div>
    <div class="field-row">
      <div class="field"><label>Q Number</label><input id="ep_qNumber"></div>
      <div class="field"><label>Part Number</label><input id="ep_partNumber"></div>
    </div>
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
      <button class="btn btn-ghost" style="color:var(--red);border-color:var(--red)" onclick="npi.dashboard.deleteProject()">Delete Project</button>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="closeModal('modalEditProj')">Cancel</button>
        <button class="btn btn-primary" onclick="npi.dashboard.saveEditProject()">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Insert PFD Step -->
<div class="modal-bg" id="modalInsert" style="display:none">
  <div class="modal modal-sm">
    <div class="modal-title">Insert Step</div>
    <div class="field">
      <label>Step Number</label>
      <input type="number" id="insertNum" min="1" step="1">
      <div style="font-size:11px;color:var(--muted);margin-top:3px" id="insertNumHint"></div>
    </div>
    <div class="field">
      <label>Step Type</label>
      <select id="insertType">
        <option value="step">Normal Step</option>
        <option value="group">Sub-assembly Group Header</option>
        <option value="sub">Sub-assembly Step</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalInsert')">Cancel</button>
      <button class="btn btn-primary" onclick="npi.apqp.confirmInsert()">Insert</button>
    </div>
  </div>
</div>

<!-- CTQ Picker -->
<div class="modal-bg" id="modalCtqPick" style="display:none">
  <div class="modal">
    <div class="modal-title">Link CTQ Requirements</div>
    <div id="ctqPickList" style="display:flex;flex-direction:column;gap:7px;max-height:340px;overflow-y:auto"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalCtqPick')">Cancel</button>
      <button class="btn btn-primary" onclick="npi.apqp.saveCtqPick()">Save</button>
    </div>
  </div>
</div>

<!-- BoM Picker for PFD step resources -->
<div class="modal-bg" id="modalBomPick" style="display:none">
  <div class="modal modal-lg">
    <div class="modal-title" id="bomPickTitle">Link Resources</div>
    <div class="bom-filter-row" id="bomPickFilter"></div>
    <div class="bom-pick-list" id="bomPickList"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalBomPick')">Cancel</button>
      <button class="btn btn-primary" onclick="npi.apqp.saveBomPick()">Save</button>
    </div>
  </div>
</div>

<!-- BoM Picker for Kit item add -->
<div class="modal-bg" id="modalKitPick" style="display:none">
  <div class="modal modal-lg">
    <div class="modal-title">Add Items to Kit</div>
    <div class="bom-filter-row" id="kitPickFilter"></div>
    <div class="bom-pick-list" id="kitPickList"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalKitPick')">Cancel</button>
      <button class="btn btn-primary" onclick="npi.bom.saveKitPick()">Add Selected</button>
    </div>
  </div>
</div>



<!-- New Bug Report -->
<div class="modal-bg" id="modalNewBug" style="display:none">
  <div class="modal">
    <div class="modal-title">🪳 Report a Bug</div>
    <div class="field-row">
      <div class="field">
        <label>Raised By</label>
        <input id="bugNewRaisedBy" class="bug-readonly-field" readonly>
      </div>
      <div class="field">
        <label>Date Raised</label>
        <input id="bugNewDate" class="bug-readonly-field" readonly>
      </div>
    </div>
    <div class="field">
      <label>Page / Area</label>
      <input id="bugNewPage" placeholder="e.g. PFMEA, Production Scheduling, Hub…">
    </div>
    <div class="field">
      <label>Bug Report *</label>
      <textarea id="bugNewDesc" placeholder="Describe what happened and what you expected to happen…" rows="5" style="resize:vertical"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalNewBug')">Cancel</button>
      <button class="btn btn-primary" onclick="bugSubmitNew()">Submit Report</button>
    </div>
  </div>
</div>

<!-- Respond & Close Bug -->
<div class="modal-bg" id="modalRespondBug" style="display:none">
  <div class="modal">
    <div class="modal-title">Respond &amp; Close Bug</div>
    <div class="field">
      <label>Original Report</label>
      <div class="bug-original-desc" id="bugRespondDesc"></div>
    </div>
    <div class="field">
      <label>Response / Resolution *</label>
      <textarea id="bugRespondText" placeholder="Describe what was done to resolve this…" rows="4" style="resize:vertical"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalRespondBug')">Cancel</button>
      <button class="btn btn-primary" onclick="bugSubmitRespond()">Close Bug</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════
     SCRIPTS — load order matters
     state → auth → db → helpers → navigation →
     hub → npi-constants → npi → rpn-chart → dashboard →
     capacity → me-capacity →
     gates → pfmea → apqp → bom → timing → trackers → app
     ═══════════════════════════════════ -->

<script src="core/js/state.js"></script>
<script src="core/js/auth.js"></script>
<script src="core/js/db.js"></script>

<script src="utils/js/helpers.js"></script>

<script src="portals/capacity/js/me-data.js"></script>
<script src="portals/capacity/js/me-utils.js"></script>
<script src="portals/capacity/js/me-calculations.js"></script>
<script src="portals/capacity/js/me-components.js"></script>
<script src="portals/capacity/js/me-team.js"></script>
<script src="portals/capacity/js/me-tasks.js"></script>
<script src="portals/capacity/js/me-products.js"></script>
<script src="portals/capacity/js/me-product-taskload.js"></script>
<script src="portals/capacity/js/me-holidays.js"></script>
<script src="portals/capacity/js/me-chart.js"></script>
<script src="portals/capacity/js/me-heatmap.js"></script>

<script src="portals/capacity/js/me-capacity.js"></script>

<script src="portals/capacity/js/prod-capacity-data.js"></script>
<script src="portals/capacity/js/work-areas-data.js"></script>
<script src="portals/capacity/js/prod-capacity-dashboard.js"></script>
<script src="portals/capacity/js/prod-capacity-workarea.js"></script>

<script src="portals/production/js/data.js"></script>

<script src="portals/production/js/planning.js"></script>

<!-- families-data.js for product families from database -->
<script src="portals/product-development/js/families-data.js"></script>
<script src="portals/product-development/js/family-templates-data.js"></script>

<!-- products-data.js and trends-chart.js are already loaded above -->
<script src="portals/product-development/product-management/js/products.js"></script>

<script src="portals/product-development/js/product-development.js"></script>
<script src="portals/product-development/js/product-management.js"></script>

<script src="portals/productmgmt/js/productmgmt.js"></script>

<!-- NPI Portal: namespace root and centralized constants -->
<script src="portals/product-development/npi/js/npi-constants.js"></script>
<script src="portals/product-development/npi/js/npi.js"></script>

<!-- NPI Portal: feature modules (all under npi.* namespace) -->
<script src="portals/product-development/npi/js/gates.js"></script>
<script src="portals/product-development/npi/js/pfmea.js"></script>

</body>
</html>
